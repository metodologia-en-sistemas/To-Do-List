<!DOCTYPE html>
<html lang="es">

  <head>
    <meta charset="UTF-8" />
    <title>Registrarse - Mi organizador</title>
    <link rel="stylesheet" href="css/style.css"/>
  </head>


  <body>

    <!--Imagen logo y dashboard-->
    <div class="card-container">
      <div class="left-img">
        <img src="foto3" alt="Ilustración de dashboard" />
      </div>
      <div class="form-side">
        <div class="logo-container">
          <img src="logo.png" alt="To-Do List Logo" class="todo-logo">
        </div>

        <!--Formulario de registro-->
        <h1>Registrarse</h1>
        <form id="formularioRegistro">
          <div class="input-group">
            <input type="text" id="nombre" name="nombre" placeholder="Nombre" required />
          </div>
          <div class="input-group">
            <input type="email" id="email" name="email" placeholder="Email" required />
          </div>
          <div class="input-group">
            <input type="password" id="password" name="password" placeholder="Contraseña" required />
          </div>
          <div class="buttons">
            <button type="submit" class="btn-primary">Registrate</button>
          </div>
        </form>
        <p class="account-text">¿Ya tienes una cuenta?<br/><a href="login.html">Inicia sesión aquí</a></p>
      </div>
    </div>

    <!--Script Js-->
    <script src="script.js"></script>
  </body>

</html>
