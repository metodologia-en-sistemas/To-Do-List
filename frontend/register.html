<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Registrarse - To-Do List</title>
  </head>
  <body>
    <h1>Registrarse</h1>

    <form id="formularioRegistro" enctype="multipart/form-data">
      <input
        type="text"
        id="nombre"
        name="nombre"
        placeholder="Nombre completo"
        required
      /><br /><br />

      <input
        type="email"
        id="email"
        name="email"
        placeholder="Email"
        required
      /><br /><br />

      <input
        type="password"
        id="password"
        name="password"
        placeholder="Contraseña"
        required
      /><br /><br />

      <input
        type="file"
        id="imagen_perfil"
        name="imagen_perfil"
        accept="image/*"
      /><br /><br />

      <button type="submit">Registrar</button>
    </form>

    <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>

    <script>
      const form = document.getElementById("formularioRegistro");

      form.addEventListener("submit", async function (e) {
        e.preventDefault();

        const formData = new FormData(form); // Captura todos los campos, incluyendo el archivo

        const response = await fetch("../backend/controllers/UserController.php", {
          method: "POST",
          body: formData, // Enviamos los datos como multipart/form-data (automático)
        });

        const data = await response.json();

        alert(data.message);

        if (data.success) {
          window.location.href = "login.html";
        }
      });
    </script>
  </body>
</html>
