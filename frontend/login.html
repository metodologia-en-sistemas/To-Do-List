<!DOCTYPE html>

<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>DevTask</title>
  <link rel="stylesheet" href="css/login.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="login">

  <form action="../backend/routes/login.php" method="POST">
    <div class="card-container">
      <div class="form-side">
        <div class="logo-container">
          <img src="./images/file_00000000f6f061f5aa225654ab2b395a.png" alt="To-Do List Logo" class="todo-logo">
        </div>

        <h1>Iniciar sesión</h1>

        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Email" required />
          <span class="error-icon"><i class="fas fa-exclamation-circle"></i></span>
        </div>

        <div class="input-group">
           <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="Contraseña" required />
        </div>

        <div class="buttons">
          <button type="submit" class="btn-primary">Ingresar</button>
        </div>

        <p class="account-text">¿No tienes una cuenta?<br/><a href="register.html">Regístrate</a></p>
      </div>
    </div>
  </form>

</body>
</html>
